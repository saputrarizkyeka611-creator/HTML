<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tabel Data Siswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #ecf0f1;
            color: #2c3e50;
            font-weight: bold;
        }
        /* Mengatur teks nomor dan jumlah agar berada di tengah */
        td:nth-child(1), 
        td:nth-child(3),
        td:nth-child(4),
        td:nth-child(5),
        td:nth-child(6) {
            text-align: center;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th colspan="3">Jumlah</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>James</td>
                <td>X</td>
                <td rowspan="3">3</td>
                <td rowspan="3">3</td>
                <td rowspan="3">3</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Zendaya</td>
                <td>Xi</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Tom</td>
                <td>Xii</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
